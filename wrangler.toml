# Config for the Worker that Cloudflare Workers Builds deploys on every push
# to main. The Worker is named "webdocsol" in the dashboard and owns the
# verumglobal.foundation routes, so this script serves BOTH the API and (via
# the static-proxy fallback in worker/verum-rules.js) the website.
name = "webdocsol"
main = "worker/verum-rules.js"
compatibility_date = "2024-11-07"
compatibility_flags = ["nodejs_compat"]

# THE ONE DECLARED ROUTE — now the whole site. This list began as a surgical
# exception to "routes stay in the dashboard" (first one transcribe path,
# then the /api/v1/ai/* subtree), winning traffic back from a stale dashboard
# route on the retired "verum-rules" Worker via the most-specific-route rule.
# On 2026-09-06 the retired "verum-rules" and "verumglobal-static" Workers
# were deleted in the dashboard, and their routes — including the one
# carrying the website — died with them, orphaning the domain. This Worker is
# the only one left and serves EVERYTHING by design (the /api/* router plus
# the Pages static proxy in worker/verum-rules.js), so the catch-all declared
# here is the permanent architecture, not an exception: every deploy
# re-asserts it, and the site cannot be orphaned by dashboard state again.
# tests/wrangler-config.test.mjs pins this list to exactly this one pattern.
# After any routing change, verify
# https://verumglobal.foundation/api/v1/rules/manifest still answers: the
# Android app (1verum Constitution.kt) and the fraud-firewall rule updater
# (firebase repo) both hard-code that URL.
routes = [
  { pattern = "verumglobal.foundation/*", zone_name = "verumglobal.foundation" }
]

# Single environment, deliberately.
#
# These bindings used to live under [env.production] only. Workers Builds
# deploys with no --env flag, which builds the TOP-LEVEL environment -- so the
# deployed Worker had no KV and no AI binding at all, and every /api/v1/ai/*
# call returned 500. The page's AI review (classify, assess, narrate) fell
# back silently and never ran. Keeping one environment means an --env-less
# deploy and an explicit one cannot diverge.

[[kv_namespaces]]
binding = "RULES_KV"
# "verum-rules-kv" -- the namespace that actually exists in the account.
id = "3e032b900b5344bd8785371cd1fd1810"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
SERVICE_VERSION = "1.5.1-20260721-mistral-enhanced"

[observability]
enabled = true

# Named "production" environment, mirroring the top level EXACTLY.
#
# The comment above is still the rule: one set of bindings, no divergence. This
# section exists because the two deploy commands must both work. Workers Builds
# runs `wrangler deploy` (no --env) -- that is the top level. But DEPLOYMENT.md
# instructed `wrangler deploy --env production` for years, and a build/deploy
# command set from those instructions aborts INSTANTLY against a config with no
# such environment ("No environment found in configuration with name
# production"). Workers Builds has failed on every push for that reason while
# Cloudflare Pages kept deploying the site, so the breakage was invisible from
# the front end and no Worker/API change has shipped since.
#
# Declaring it makes either command deploy the same Worker with the same
# bindings. tests/wrangler-config.test.mjs asserts this block stays byte-equal
# to the top-level bindings, so "cannot diverge" is enforced, not just intended.
[env.production]
routes = [
  { pattern = "verumglobal.foundation/*", zone_name = "verumglobal.foundation" }
]

[[env.production.kv_namespaces]]
binding = "RULES_KV"
id = "3e032b900b5344bd8785371cd1fd1810"

[env.production.ai]
binding = "AI"

[env.production.vars]
ENVIRONMENT = "production"
SERVICE_VERSION = "1.5.1-20260721-mistral-enhanced"

[env.production.observability]
enabled = true

# Routing, current era (since 2026-09-06): this Worker owns
# verumglobal.foundation/* through the single declared route at the top of
# this file — site pages via the Pages proxy fallback, /api/* via the router.
# The old "routes stay dashboard-managed" rule existed to protect production
# traffic owned by OTHER Workers; those Workers (verum-rules,
# verumglobal-static) are deleted, so the repo is now the one source of truth
# for both the code and the route, and the test pins the list so the route
# can neither narrow nor multiply without a deliberate, reviewed change.
#
# Admin note: the admin endpoints (/api/v1/admin/publish, /api/v1/ai/curate)
# require the ADMIN_TOKEN secret on THIS Worker (`wrangler secret put
# ADMIN_TOKEN`). Any copy that lived on the deleted verum-rules Worker is
# gone; without it those two endpoints return a clean JSON error and nothing
# else is affected.

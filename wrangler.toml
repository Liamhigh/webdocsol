# Config for the Worker that Cloudflare Workers Builds deploys on every push
# to main. The Worker is named "webdocsol" in the dashboard and is the origin
# of verumglobal.foundation and www (Custom Domains declared below), so this
# script serves BOTH the API and (via the serving chain in
# worker/static-proxy.js) the website.
name = "webdocsol"
main = "worker/verum-rules.js"
compatibility_date = "2024-11-07"
compatibility_flags = ["nodejs_compat"]

# THE DOMAIN, AS CUSTOM DOMAINS — both hostnames, this Worker as their origin.
# History: this list began as a surgical exception to "routes stay in the
# dashboard" (one transcribe path, then /api/v1/ai/*), winning traffic back
# from a stale dashboard route on the retired "verum-rules" Worker. On
# 2026-09-06 the retired "verum-rules" and "verumglobal-static" Workers were
# deleted in the dashboard and their routes died with them, so this file
# declared the zone routes `verumglobal.foundation/*` and (2026-09-07)
# `www.verumglobal.foundation/*`. The outside probe (.github/workflows/
# live-site-probe.yml) then showed NEITHER route in effect: the apex was
# answered by the March mock-up Worker `verum-omnis-forensic-web` (a Workers
# Custom Domain) and www by the Cloudflare Pages project `verumglobal` (a
# Pages custom domain, i.e. a CNAME), and nothing reached this Worker on
# either host. A zone route only runs in front of a proxied DNS record it
# does not create; a Custom Domain is Cloudflare's documented replacement for
# a `/*` route — Cloudflare creates the DNS record and the certificate, and
# every deploy re-asserts the binding:
# https://developers.cloudflare.com/workers/configuration/routing/custom-domains/
# Dashboard prerequisite (founder, once): the apex must be released by
# `verum-omnis-forensic-web` (remove its Custom Domain, or delete the Worker)
# and www by the Pages project (remove the custom domain, then delete the
# leftover CNAME in DNS → Records). A Custom Domain cannot be created over an
# existing CNAME, and a deploy that meets either conflict fails its triggers
# step AFTER the code has uploaded — the code still ships; the binding waits.
# Adding the two Custom Domains by hand in webdocsol → Settings → Domains &
# Routes is equivalent and immediate; the next deploy then finds them in place.
# tests/wrangler-config.test.mjs pins this list to exactly these two
# hostnames, both as Custom Domains, in both environments.
# After any routing change, verify
# https://verumglobal.foundation/api/v1/rules/manifest still answers: the
# Android app (1verum Constitution.kt) and the fraud-firewall rule updater
# (firebase repo) both hard-code that URL.
#
# THE SECOND DOOR — workers.dev. Wrangler switches the *.workers.dev address
# off when routes or domains are declared, and on 2026-09-07 the outside
# probe found the Worker reachable on NO host at all: the domain bound
# elsewhere, workers.dev answering Cloudflare error 1042. Keeping the
# address on (webdocsol.<account>.workers.dev) gives the site and the API a
# stable second door that does not depend on the domain binding: the probe
# can verify a deploy, the founder can seal on it while the domain is being
# repaired, and /api/v1/status shows whether a rule package is published.
# Pages carry a canonical link to the domain, so search engines are not
# confused. Same Worker, same bindings, same code.
workers_dev = true
routes = [
  { pattern = "verumglobal.foundation", custom_domain = true },
  { pattern = "www.verumglobal.foundation", custom_domain = true }
]

# THE SITE SHIPS WITH THE WORKER — Workers Static Assets. The Cloudflare
# Pages origin behind the old proxy turned out stale: Pages answers every
# missing file with the home page as a 200 (its no-404.html fallback), so
# /seal-document.html came back as the home page and the site's images broke.
# Bundling the repo root as static assets means every deploy carries the
# exact site that is in version control: any file that exists here is served
# directly, /api/* always runs the Worker (run_worker_first), and a path
# matching no asset falls through to the Worker's serveStatic Pages proxy as
# a last resort. .assetsignore keeps source (worker/, tests/) and config out
# of the upload. tests/wrangler-config.test.mjs drift-locks this block
# against [env.production.assets].
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Single environment, deliberately.
#
# These bindings used to live under [env.production] only. Workers Builds
# deploys with no --env flag, which builds the TOP-LEVEL environment -- so the
# deployed Worker had no KV and no AI binding at all, and every /api/v1/ai/*
# call returned 500. The page's AI review (classify, assess, narrate) fell
# back silently and never ran. Keeping one environment means an --env-less
# deploy and an explicit one cannot diverge.

[[kv_namespaces]]
binding = "RULES_KV"
# "verum-rules-kv" -- the namespace that actually exists in the account.
id = "3e032b900b5344bd8785371cd1fd1810"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
SERVICE_VERSION = "1.5.1-20260721-mistral-enhanced"
# Court-ready narrative (human report) model — keyless Workers AI. Optional external
# OpenAI-compatible provider via secrets (never here): LLM_API_BASE, LLM_API_KEY, LLM_MODEL.
HUMAN_REPORT_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

[observability]
enabled = true

# Named "production" environment, mirroring the top level EXACTLY.
#
# The comment above is still the rule: one set of bindings, no divergence. This
# section exists because the two deploy commands must both work. Workers Builds
# runs `wrangler deploy` (no --env) -- that is the top level. But DEPLOYMENT.md
# instructed `wrangler deploy --env production` for years, and a build/deploy
# command set from those instructions aborts INSTANTLY against a config with no
# such environment ("No environment found in configuration with name
# production"). Workers Builds has failed on every push for that reason while
# Cloudflare Pages kept deploying the site, so the breakage was invisible from
# the front end and no Worker/API change has shipped since.
#
# Declaring it makes either command deploy the same Worker with the same
# bindings. tests/wrangler-config.test.mjs asserts this block stays byte-equal
# to the top-level bindings, so "cannot diverge" is enforced, not just intended.
[env.production]
workers_dev = true
routes = [
  { pattern = "verumglobal.foundation", custom_domain = true },
  { pattern = "www.verumglobal.foundation", custom_domain = true }
]

[env.production.assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[env.production.kv_namespaces]]
binding = "RULES_KV"
id = "3e032b900b5344bd8785371cd1fd1810"

[env.production.ai]
binding = "AI"

[env.production.vars]
ENVIRONMENT = "production"
SERVICE_VERSION = "1.5.1-20260721-mistral-enhanced"
HUMAN_REPORT_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

[env.production.observability]
enabled = true

# Routing, current era (since 2026-09-07): this Worker is the origin of
# verumglobal.foundation and www through the two Custom Domains declared at
# the top of this file — site pages via the serving chain, /api/* via the
# router. The old "routes stay dashboard-managed" rule existed to protect
# production traffic owned by OTHER Workers; those Workers (verum-rules,
# verumglobal-static) are deleted, so the repo is the one source of truth for
# both the code and the domain binding, and the test pins the list so it can
# neither narrow nor multiply without a deliberate, reviewed change.
#
# Admin note: the admin endpoints (/api/v1/admin/publish, /api/v1/ai/curate)
# require the ADMIN_TOKEN secret on THIS Worker (`wrangler secret put
# ADMIN_TOKEN`). Any copy that lived on the deleted verum-rules Worker is
# gone; without it those two endpoints return a clean JSON error and nothing
# else is affected.

# Config for the Worker that Cloudflare Workers Builds deploys on every push
# to main. The Worker is named "webdocsol" in the dashboard and owns the
# verumglobal.foundation routes, so this script serves BOTH the API and (via
# the static-proxy fallback in worker/verum-rules.js) the website.
name = "webdocsol"
main = "worker/verum-rules.js"
compatibility_date = "2024-11-07"
compatibility_flags = ["nodejs_compat"]

# THE ONE DECLARED ROUTE — a surgical exception to "routes stay in the
# dashboard" (see the note at the bottom of this file). A stale dashboard
# route still points the domain's /api/* traffic at the retired "verum-rules"
# Worker (last deployed 2026-07-20): it 404s endpoints added since (transcribe)
# and serves July code for the ones that changed (assess, and narrate with its
# honesty rules). Cloudflare gives traffic to the MOST SPECIFIC matching
# route, so declaring the AI subtree here reclaims exactly /api/v1/ai/* for
# this Worker and nothing else — the site, the rules manifest and the
# feedback/admin endpoints stay on the dashboard-managed routes (all of those
# are unchanged since the freeze, verified handler-by-handler against the
# 2026-07-20 code). tests/wrangler-config.test.mjs pins this list to exactly
# this one pattern — broadening it further is a test failure by design.
# Remove this once the stale dashboard routes are deleted. During that
# cleanup, verify https://verumglobal.foundation/api/v1/rules/manifest still
# answers afterwards: the Android app (1verum Constitution.kt) and the
# fraud-firewall rule updater (firebase repo) both hard-code that URL.
routes = [
  { pattern = "verumglobal.foundation/api/v1/ai/*", zone_name = "verumglobal.foundation" }
]

# Single environment, deliberately.
#
# These bindings used to live under [env.production] only. Workers Builds
# deploys with no --env flag, which builds the TOP-LEVEL environment -- so the
# deployed Worker had no KV and no AI binding at all, and every /api/v1/ai/*
# call returned 500. The page's AI review (classify, assess, narrate) fell
# back silently and never ran. Keeping one environment means an --env-less
# deploy and an explicit one cannot diverge.

[[kv_namespaces]]
binding = "RULES_KV"
# "verum-rules-kv" -- the namespace that actually exists in the account.
id = "3e032b900b5344bd8785371cd1fd1810"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
SERVICE_VERSION = "1.5.1-20260721-mistral-enhanced"

[observability]
enabled = true

# Named "production" environment, mirroring the top level EXACTLY.
#
# The comment above is still the rule: one set of bindings, no divergence. This
# section exists because the two deploy commands must both work. Workers Builds
# runs `wrangler deploy` (no --env) -- that is the top level. But DEPLOYMENT.md
# instructed `wrangler deploy --env production` for years, and a build/deploy
# command set from those instructions aborts INSTANTLY against a config with no
# such environment ("No environment found in configuration with name
# production"). Workers Builds has failed on every push for that reason while
# Cloudflare Pages kept deploying the site, so the breakage was invisible from
# the front end and no Worker/API change has shipped since.
#
# Declaring it makes either command deploy the same Worker with the same
# bindings. tests/wrangler-config.test.mjs asserts this block stays byte-equal
# to the top-level bindings, so "cannot diverge" is enforced, not just intended.
[env.production]
routes = [
  { pattern = "verumglobal.foundation/api/v1/ai/*", zone_name = "verumglobal.foundation" }
]

[[env.production.kv_namespaces]]
binding = "RULES_KV"
id = "3e032b900b5344bd8785371cd1fd1810"

[env.production.ai]
binding = "AI"

[env.production.vars]
ENVIRONMENT = "production"
SERVICE_VERSION = "1.5.1-20260721-mistral-enhanced"

[env.production.observability]
enabled = true

# Routes stay dashboard-managed AS A RULE — declaring them broadly would let
# any deploy from this repo re-point live production traffic. The single
# declared exception is the AI-subtree route at the top of this file: a stale
# dashboard route (old "verum-rules" Worker, frozen 2026-07-20) captures
# /api/*, 404ing endpoints added since and serving July code for the AI layer,
# and the most-specific-route rule makes one /api/v1/ai/* pattern the
# least-power fix that can ship from the repo — it re-points the AI endpoints
# only, never the site or the non-AI API. The test pins the list to that one
# pattern; zone-wide /* and api-wide /api/* stay forbidden.
#
# Routes this Worker answers on (dashboard-managed):
#   verumglobal.foundation/*  (site via Pages proxy, /api/* via the router)

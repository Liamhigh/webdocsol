name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-failure-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
